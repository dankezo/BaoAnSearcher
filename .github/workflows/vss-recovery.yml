name: VSS daily recovery
on:
  # Daily execution uses the reachable local Windows network (06:15 VN).
  # Hosted Ubuntu and Windows probes both failed on 2026-11-06.
  # Keep manual cloud recovery available; do not schedule a known failing route.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-public-data
  cancel-in-progress: false
jobs:
  vss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      VSS_EXPORT_RELAY_URL: ${{ secrets.VSS_EXPORT_RELAY_URL }}
      VSS_EXPORT_RELAY_KEY: ${{ secrets.VSS_EXPORT_RELAY_KEY }}
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - name: Verify VSS recovery before writing data
        run: python -m unittest tests.test_vss_daily tests.test_vss_relay tests.test_cloud_crawl tests.test_regulatory_daily -q
      - name: Catch up VSS independently of MSC and YCBG
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(TZ=Asia/Bangkok date +%u)" = 7 ]; then
            echo 'Sunday pause; VSS data and success timestamp retained.'
            exit 0
          fi
          python scripts/vss_daily.py --publish --force
