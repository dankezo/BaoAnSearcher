name: Daily public data crawl
on:
  schedule:
    - cron: '17 19 * * *' # 02:17 VN; allow for hosted scheduler delays
    - cron: '17 22 * * *' # 05:17 VN recovery; completed sources are skipped
  workflow_dispatch:
    inputs:
      only:
        description: Sources (prices,tenders,ycbg,dav,vss)
        default: tenders,prices,ycbg,dav
        type: string
      days:
        description: Replay days (1–30)
        default: '3'
        type: string
      runner:
        description: Runner platform
        default: ubuntu-latest
        type: choice
        options: [windows-latest, ubuntu-latest]
      daily:
        description: Skip sources already verified today
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  crawl:
    concurrency:
      group: daily-public-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ${{ matrix.source == 'dav' && 'windows-latest' || inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [prices, tenders, ycbg, dav, vss]
    env:
      TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      CLOUDFLARE_CRAWL_WORKER_URL: ${{ secrets.CLOUDFLARE_CRAWL_WORKER_URL }}
      CLOUDFLARE_CRAWL_WORKER_KEY: ${{ secrets.CLOUDFLARE_CRAWL_WORKER_KEY }}
      CLOUDFLARE_YCBG_KEY: ${{ secrets.CLOUDFLARE_YCBG_KEY }}
      VSS_EXPORT_RELAY_URL: ${{ secrets.VSS_EXPORT_RELAY_URL }}
      VSS_EXPORT_RELAY_KEY: ${{ secrets.VSS_EXPORT_RELAY_KEY }}
      CRAWL_ONLY: ${{ inputs.only || 'tenders,prices,ycbg,dav' }}
      CRAWL_DAILY: ${{ github.event_name == 'schedule' || inputs.daily }}
      CRAWL_DAYS: ${{ inputs.days || '3' }}
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
        if: contains(env.CRAWL_ONLY, matrix.source)
      - run: pip install -r "test zone/procurement/requirements.txt"
        if: (matrix.source == 'tenders' || matrix.source == 'ycbg') && contains(env.CRAWL_ONLY, matrix.source)
      - run: python -m playwright install --with-deps chromium
        if: (matrix.source == 'tenders' || matrix.source == 'ycbg') && contains(env.CRAWL_ONLY, matrix.source) && (matrix.source == 'ycbg' || env.CLOUDFLARE_CRAWL_WORKER_URL == '')
      - name: Verify YCBG fallback before updating data
        if: matrix.source == 'ycbg' && contains(env.CRAWL_ONLY, matrix.source)
        run: python -m unittest tests.test_ycbg_fallback tests.test_ycbg_cloud tests.test_ycbg tests.test_ycbg_publish -q
      - name: Verify MSC browser cooldown before updating data
        if: matrix.source == 'tenders' && contains(env.CRAWL_ONLY, matrix.source)
        run: python -m unittest tests.test_msc_browser_retry -q
      - run: python scripts/crawl_ycbg.py --publish --daily
        if: matrix.source == 'ycbg' && contains(env.CRAWL_ONLY, matrix.source)
      - name: Verify DAV before updating data
        if: matrix.source == 'dav' && contains(env.CRAWL_ONLY, matrix.source)
        run: python -m unittest tests.test_dav_daily -q
      - name: Update DAV
        if: matrix.source == 'dav' && contains(env.CRAWL_ONLY, matrix.source)
        run: |
          daily=()
          if [ "$CRAWL_DAILY" = true ]; then daily=(--daily); fi
          python scripts/dav_daily.py --publish "${daily[@]}"
      - run: |
          daily=()
          if [ "$CRAWL_DAILY" = true ]; then daily=(--daily); fi
          python scripts/cloud_daily.py --yes-remote --only "$CRAWL_SOURCE" --days "$CRAWL_DAYS" "${daily[@]}"
        if: matrix.source != 'ycbg' && matrix.source != 'dav' && contains(env.CRAWL_ONLY, matrix.source)
        env:
          CRAWL_SOURCE: ${{ matrix.source }}
  analytics-snapshots:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        if: env.R2_BUCKET != ''
      - uses: actions/setup-node@v4
        if: env.R2_BUCKET != ''
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: env.R2_BUCKET != ''
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        if: env.R2_BUCKET != ''
      - run: pip install boto3 python-dotenv
        if: env.R2_BUCKET != ''
      - run: python scripts/tidb/publish_r2_snapshots.py --yes-remote --analytics
        if: env.R2_BUCKET != ''
